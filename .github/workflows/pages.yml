name: Check and publish Stock Room
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check focused phone workflows
        run: |
          npm run dev > /tmp/qp-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Local preview did not start')
          PYTHON
          python tests/focused_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-phone-checks
          path: test-results/focused-*.png
          if-no-files-found: ignore
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Detect the configured Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo "Pages publishes the branch's root index.html; custom deployment is skipped to avoid competing publishers."
          fi
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.mode == 'workflow'
      - name: Deploy to GitHub Pages
        if: steps.source.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
